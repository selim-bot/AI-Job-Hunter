services:
  database:
    image: postgres:16
    environment:
      POSTGRES_USER: jobhunter
      POSTGRES_PASSWORD: local_password
      POSTGRES_DB: jobhunter
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - database

volumes:
  postgres_data:
